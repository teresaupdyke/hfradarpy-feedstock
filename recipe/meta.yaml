{% set name = "hfradarpy" %}
{% set version = "2.0.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/rowg/hfradarpy/archive/{{ version }}.tar.gz
  sha256: 6f5e5f9056ebb8766229620518508b9c0d8a9f74d7d060a99d3a636ceef8d494

build:
  entry_points:
    - hfradarpy=hfradarpy.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 0

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - xarray
    - netcdf4
    - pyproj
    - click
    - dask-core
    - geopandas
    - cartopy
    - matplotlib-base
    - cmocean
    - joblib
    - basemap
    - geopy
    - oceans
    - pytest
    - shapely
    - polycircles

test:
  imports:
    - hfradarpy
  commands:
    - hfradarpy --help
  requires:
    - pip

about:
  home: https://github.com/rowg/hfradarpy
  summary: 'Toolbox to read in High Frequency Radar (HFR) files written in the Codar Tabular Format (CTF). Easily read CODAR Ocean Sensors SeaSonde and HELZEL Messtechnik GmbH WERA radial files.'
  license: MIT
  license_file: LICENSE
  doc_url: https://hfradarpy.readthedocs.io/en/latest/
  dev_url: https://github.com/rowg/hfradarpy

extra:
  recipe-maintainers:
    - najascutellatus
    - teresaupdyke
