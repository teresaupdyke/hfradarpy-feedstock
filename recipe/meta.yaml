{% set name = "hfradarpy" %}
{% set version = "1.0.0.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/rowg/hfradarpy/archive/{{ version }}.tar.gz
  sha256: b053c0d0a5bd870bf9a390d7acea7e85ddb20b60bbe2fb9fe611caeb2dc4f277

build:
  entry_points:
    - hfradarpy=hfradarpy.cli:main
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  number: 0

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools
  run:
    - python >=3.10
    - xarray
    - netcdf4
    - pyproj
    - click
    - dask-core
    - geopandas
    - cartopy
    - matplotlib-base
    - cmocean
    - joblib
    - basemap
    - geopy
    - oceans

test:
  imports:
    - hfradarpy
  commands:
    - pip check
    - hfradarpy --help
  requires:
    - pip

about:
  home: https://github.com/rowg/hfradarpy
  summary: 'Toolbox to read in High Frequency Radar (HFR) files written in the Codar Tabular Format (CTF). Easily read CODAR Ocean Sensors SeaSonde and HELZEL Messtechnik GmbH WERA radial files.'
  license: MIT
  license_file: LICENSE
  doc_url: https://hfradarpy.readthedocs.io/en/latest/
  dev_url: https://github.com/rowg/hfradarpy

extra:
  recipe-maintainers:
    - najascutellatus
    - teresaupdyke
